name: Image

# Builds the deployable image on every PR (stacked ones included) so a change
# that only breaks the image build fails here, not in a downstream deploy.
# Pushes to ghcr.io/ryscheng/officexr only from main.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Read playwright-core version
        id: versions
        run: echo "playwright_core=$(jq -r '.dependencies["playwright-core"]' packages/studio-mcp/package.json)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=sha,format=long,prefix=
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: PLAYWRIGHT_CORE_VERSION=${{ steps.versions.outputs.playwright_core }}
          # mode=max keeps the intermediate stages (store, packs, browser) too,
          # so a commit that changes only source reuses all of them.
          cache-from: type=gha,scope=image
          cache-to: type=gha,scope=image,mode=max
